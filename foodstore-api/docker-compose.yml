name: Foodstore

services:
  traefik:
    image: traefik:v3.7.11
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8080"
      - "--entrypoints.traefik.address=:9090"
    ports:
      - "80:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  db:
    image: postgres:18.6-trixie
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=vi-VN-x-icu"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:8.10.1-trixie
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uploads.rule=PathPrefix(`/uploads`)"
      - "traefik.http.routers.uploads.priority=30"
      - "traefik.http.middlewares.strip-uploads.stripprefix.prefixes=/uploads"
      - "traefik.http.routers.uploads.middlewares=strip-uploads"
      - "traefik.http.services.uploads.loadbalancer.server.port=9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - s3_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9000/ > /dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodstore-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${DB_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectTimeout=10000,syncTimeout=5000,ssl=false,allowAdmin=false"
      S3__Endpoint: "http://rustfs:9000"
      S3__AccessKey: ${S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY}
      S3__Bucket: ${S3_BUCKET}
      S3__PublicUrl: "http://localhost/uploads/${S3_BUCKET}"
      JwtSettings__SecretKey: ${JWT_SECRET}
      JwtSettings__Issuer: "FoodstoreAPI"
      JwtSettings__Audience: "FoodstoreFrontend"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: "8080"
      AllowedOrigins__0: ${CORS_ORIGIN_0}
      AllowedOrigins__1: ${CORS_ORIGIN_1}
      AllowedOrigins__2: ${CORS_ORIGIN_2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
  s3_data:
  redis_data:

networks:
  app-network:
    driver: bridge
